name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    runs-on: windows-latest

    env:
      NuGetPackageSourceCredentials_github-storyboard: "Username=github-actions;Password=${{ secrets.GITHUB_TOKEN }}"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore
        run: |
          dotnet restore StoryboardDesigner.App.Tests/StoryboardDesigner.App.Tests.csproj --configfile NuGet.Config
          dotnet restore StoryboardDesigner.App.SmokeTests/StoryboardDesigner.App.SmokeTests.csproj --configfile NuGet.Config

      - name: Build
        run: |
          dotnet build StoryboardDesigner.App.Tests/StoryboardDesigner.App.Tests.csproj --configuration Release --no-restore
          dotnet build StoryboardDesigner.App.SmokeTests/StoryboardDesigner.App.SmokeTests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test StoryboardDesigner.App.Tests/StoryboardDesigner.App.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
